name: List PR check

# pull_request_target gives a base-repo token so fork PRs get a sticky comment.
# We only run the workflow/script from the base branch; PR list files are fetched as data.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-list-entries:
    name: Format, stars, links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch (trusted scripts only)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch PR list files and diff (data only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          touched=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '[.[].filename] | map(select(.=="README.md" or .=="emerging.md")) | length')
          if [ "$touched" = "0" ]; then
            echo "No list file changes; skipping checks."
            echo "SKIP_CHECK=1" >> "$GITHUB_ENV"
            exit 0
          fi

          for f in README.md emerging.md; do
            if gh api "repos/${REPO}/contents/${f}?ref=${HEAD_SHA}" --jq .content 2>/dev/null | base64 -d >"$f"; then
              echo "Loaded head $f"
            else
              echo "Keeping base $f"
            fi
          done

          {
            echo "diff --git a/README.md b/README.md"
            echo "--- a/README.md"
            echo "+++ b/README.md"
            gh api "repos/${REPO}/compare/${BASE_SHA}...${HEAD_SHA}" \
              --jq '.files[] | select(.filename=="README.md") | .patch // empty' || true
            echo "diff --git a/emerging.md b/emerging.md"
            echo "--- a/emerging.md"
            echo "+++ b/emerging.md"
            gh api "repos/${REPO}/compare/${BASE_SHA}...${HEAD_SHA}" \
              --jq '.files[] | select(.filename=="emerging.md") | .patch // empty' || true
          } > /tmp/list.diff

          echo "DIFF_FILE=/tmp/list.diff" >> "$GITHUB_ENV"
          echo "BASE_SHA=${BASE_SHA}" >> "$GITHUB_ENV"
          echo "HEAD_SHA=${HEAD_SHA}" >> "$GITHUB_ENV"
          echo "PR_NUMBER=${PR_NUMBER}" >> "$GITHUB_ENV"
          echo "SKIP_CHECK=0" >> "$GITHUB_ENV"

      - name: Run PR check
        if: env.SKIP_CHECK != '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DIFF_FILE: /tmp/list.diff
          POST_PR_COMMENT: "true"
          REPORT_FILE: pr-check-report.md
        run: python3 .github/scripts/pr-check.py
